<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>UltraClear Acquisition Tool</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <div class="head">
            <div id="automationStatus">Automation status: idle</div>
            <div class="form-group usg-toggle-group">
                <button id="toggleUsgBtn" class="small-btn">Start USG preview</button>
            </div>
            <button id="deleteRecording">Delete Last Recording</button>
            <div id="iterationCounter">Iteration: -</div>
        </div>

        <div class="content-wrapper">

            <aside class="sidebar">
                <div class="form-section">
                    <div class="form-grid">
                        <div class="form-group devices-section">
                            <label>Devices</label>
                            <div class="device-row">
                                <input type="checkbox" id="deviceUSG" />
                                <label for="deviceUSG">USG Scanner</label>
                                <span id="deviceUSGStatus" class="device-status"></span>
                            </div>
                            <div class="device-row">
                                <label style="margin-left: 0; margin-bottom: 8px;">Trackers</label>
                            </div>
                            <div class="device-row">
                                <input type="checkbox" id="trackerIMU" />
                                <label for="trackerIMU">IMU Tracker</label>
                                <span id="trackerIMUStatus" class="device-status"></span>
                            </div>
                            <div class="device-row">
                                <input type="checkbox" id="trackerPSMove" />
                                <label for="trackerPSMove">PSMove Tracker</label>
                                <span id="trackerPSMoveStatus" class="device-status"></span>
                            </div>
                            <div class="device-row">
                                <input type="checkbox" id="deviceMEMS" />
                                <label for="deviceMEMS">Raspberry Pi MEMS microphone</label>
                                <span id="deviceMEMSStatus" class="device-status"></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="audioSource">Camera audio input source</label>
                            <select id="audioSource"></select>
                        </div>
                        <div class="form-group">
                            <label for="videoProfile">Video recording profile</label>
                            <select id="videoProfile">
                                <option value="quality">Better quality</option>
                                <option value="performance">Better performance</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="videoSource">Video source</label>
                            <select id="videoSource"></select>
                        </div>
                        <div class="form-group">
                            <label for="videoSource2">Video source second</label>
                            <select id="videoSource2"></select>
                        </div>

                        <div class="form-group">
                            <label for="material">Material</label>
                            <select id="material"></select>
                        </div>

                        <div class="form-group">
                            <label for="needleType">Needle type</label>
                            <select id="needleType"></select>
                        </div>

                        <div class="form-group">
                            <label for="sensorVersion">Sensor version</label>
                            <select id="sensorVersion"></select>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" />
                        </div>

                        <div class="form-group">
                            <label for="modeToggle">Mode</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="modeToggle" />
                                <label class="switch-label" for="modeToggle">
                                    <span class="label automation-label">Automation</span>
                                    <span class="label manual-label">Manual Recording</span>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>

                        <div id="automationForm">
                            <div id="iterationsGroup" class="form-group horizontal-group">
                                <label for="iterations">Number of iterations</label>
                                <input type="number" id="iterations" value="10" min="1" />
                            </div>
                            <div id="repetitionsGroup" class="form-group horizontal-group">
                                <label for="repetitions">Number of repetitions</label>
                                <input type="number" id="repetitions" value="1" min="1" />
                            </div>
                            <div class="form-group">
                                <label for="speed">
                                    Speed: <span id="speedValue">50</span>
                                </label>
                                <input type="range" id="speed" name="speed" min="1" max="100" step="1" value="50" />
                            </div>
                            <div class="form-group automation-mode-selector">
                                <label for="automationMode">Automation mode</label>
                                <select id="automationMode">
                                    <option value="points">Coordinate path</option>
                                    <option value="arc180">Circular arc 180°</option>
                                    <option value="updown">Up/Down</option>
                                    <option value="grid">Grid (from file)</option>
                                </select>
                            </div>
                            <div id="pointsPathForm" class="form-group points-section">
                                <label>Dobot Coordinates Path (X, Y, Z, R)</label>
                                <div id="pointsContainer">
                                    <!-- Points will be injected here -->
                                </div>
                                <button type="button" id="addPointBtn" class="small-btn">+ Add dobot point</button>
                            </div>
                            <div id="arcPathForm" class="form-group" style="display: none;">
                                <label>Circular arc parameters (angles: -90° → 0° → +90°)</label>
                                <div class="arc-parameters">
                                    <div class="param-group-wrapper">
                                        <label for="arcCenterX">Center X (Xc)</label>
                                        <input type="number" id="arcCenterX" value="350" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="arcCenterY">Center Y (Yc)</label>
                                        <input type="number" id="arcCenterY" value="0" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="arcZ">Fixed Z</label>
                                        <input type="number" id="arcZ" value="-50" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="arcRadius">Radius</label>
                                        <input type="number" id="arcRadius" value="145" min="0.001" step="any" />
                                    </div>
                                </div>
                                <div id="arcPointsPreview" class="arc-preview"></div>
                            </div>
                            <div id="upDownForm" class="form-group" style="display: none;">
                                <label>Up/Down parameters</label>
                                <div class="arc-parameters">
                                    <div class="param-group-wrapper">
                                        <label for="upDownInitX">Initial X</label>
                                        <input type="number" id="upDownInitX" value="300" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="upDownFinishX">Finish X</label>
                                        <input type="number" id="upDownFinishX" value="400" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="upDownY">Y</label>
                                        <input type="number" id="upDownY" value="0" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="upDownR">R</label>
                                        <input type="number" id="upDownR" value="-50" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="upDownUpZ">Up Z</label>
                                        <input type="number" id="upDownUpZ" value="80" step="any" />
                                    </div>
                                    <div class="param-group-wrapper">
                                        <label for="upDownDownZ">Down Z</label>
                                        <input type="number" id="upDownDownZ" value="0" step="any" />
                                    </div>
                                </div>
                                <label>Motion style</label>
                                <div class="radio-group">
                                    <label><input type="radio" name="upDownMotionType" value="up_down" checked />Only up and down</label>
                                    <label><input type="radio" name="upDownMotionType" value="up_down_forward" />Up, down, forward</label>
                                </div>
                                <div class="form-group horizontal-group">
                                    <label for="upDownIntervalToggle">Interval</label>
                                    <label class="simple-toggle">
                                        <input type="checkbox" id="upDownIntervalToggle" />
                                        <span class="slider"></span>
                                    </label>
                                    <input type="number" id="upDownInterval" min="0.001" step="any" style="display: none;" />
                                </div>
                            </div>
                            <div id="gridForm" class="form-group" style="display: none;">
                                <label>Grid parameters</label>
                                <div class="arc-preview">Grid points are read from the file set as "grid_config" in setup.json.
Sleep time is the recording duration at every point.</div>
                            </div>
                            <div id="initialSleepTimeGroup" class="form-group horizontal-group">
                                <label for="initialSleepTime">Initial sleep time</label>
                                <input type="number" id="initialSleepTime" value="3" min="0" />
                            </div>
                            <div class="form-group horizontal-group">
                                <label for="sleepTime">Sleep time</label>
                                <input type="number" id="sleepTime" value="3" min="0" />
                            </div>
                            <div id="controls">
                                <button id="startTests">Start automation</button>
                                <button id="stopTests" disabled>Stop automation</button>
                            </div>
                        </div>

                        <div id="manualForm" style="display: none;">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" id="username" />
                            </div>
                            <div id="controls">
                                <button id="startRecording">Start recording</button>
                                <button id="stopRecording" disabled>Stop recording</button>
                            </div>
                        </div>

                        <div id="recordingTimer">Timer: 0s</div>
                    </div>
                </div>
            </aside>

            <main class="media-section">

                <div class="video-row">
                    <div class="video">
                        <div id="resVideo1" class="resolution-label"></div>
                        <video id="video" controls autoplay playsinline muted></video>
                    </div>
                    <div class="video">
                        <div id="resVideo2" class="resolution-label"></div>
                        <video id="video2" controls autoplay playsinline muted></video>
                    </div>
                </div>
                <div class="video-row">
                    <div class="video">
                        <div class="resolution-label">USG Preview</div>
                        <img id="usgStream" src="" alt="Live USG Preview" style="display:none;"
                            onerror="this.style.display='none'" />
                    </div>
                </div>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/corbanbrook/dsp.js/dsp.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothie/1.34.0/smoothie.min.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
